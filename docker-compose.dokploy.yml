# Production compose for Dokploy. Attach the domain to the `app` service,
# container port 3000, in the Dokploy UI. Do not add Traefik labels or ports.
#
# Single replica only: the Tunnel config GET->PUT mutex lives in-process
# (see docs/adr/0001-no-database-single-replica.md). Never scale `app` above 1.
#
# Set these in Dokploy's Environment UI (never commit values).
# SESSION_SECRET signs every session cookie: changing it logs everyone out.
# Keep it unchanged across redeploys and host moves.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (32+ chars)}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:?set CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:?set CLOUDFLARE_ZONE_ID}
      CLOUDFLARE_TUNNEL_ID: ${CLOUDFLARE_TUNNEL_ID:?set CLOUDFLARE_TUNNEL_ID}
      DOMAIN: ${DOMAIN:?set DOMAIN}
      SERVICE_URL: ${SERVICE_URL:?set SERVICE_URL}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
