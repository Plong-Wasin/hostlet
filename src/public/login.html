<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hostlet</title>
  </head>
  <body>
    <main>
      <h1>Hostlet</h1>
      <p>Sign in to manage published hostnames.</p>
      <p id="message" role="status" aria-live="polite"></p>
      <form id="login-form">
        <label>Username <input name="username" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Log in</button>
      </form>
      <section id="dashboard" hidden>
        <h2>Dashboard</h2>
        <p>You are signed in.</p>
        <form id="create-form">
          <label>Subdomain <input id="subdomain" name="subdomain" autocomplete="off" minlength="1" maxlength="63" required></label>
          <p>Hostname preview: <output id="hostname-preview">https://.__HOSTLET_DOMAIN__</output></p>
          <button type="submit">Create</button>
        </form>
        <p id="create-message" role="status" aria-live="polite"></p>
        <button id="logout" type="button">Log out</button>
      </section>
    </main>
    <script>
      const form = document.querySelector("#login-form");
      const dashboard = document.querySelector("#dashboard");
      const message = document.querySelector("#message");
      const createForm = document.querySelector("#create-form");
      const subdomainInput = document.querySelector("#subdomain");
      const hostnamePreview = document.querySelector("#hostname-preview");
      const createMessage = document.querySelector("#create-message");
      const domain = "__HOSTLET_DOMAIN__";
      function updatePreview() {
        subdomainInput.value = subdomainInput.value.toLowerCase();
        hostnamePreview.textContent = `https://${subdomainInput.value}.${domain}`;
      }
      subdomainInput.addEventListener("input", updatePreview);
      createForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        updatePreview();
        createMessage.textContent = "";
        const response = await fetch("/api/hostnames", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ subdomain: subdomainInput.value }),
        });
        const result = await response.json();
        if (response.ok && result.status === "created") {
          createMessage.textContent = "Published Application created: ";
          const link = document.createElement("a");
          link.id = "success-link";
          link.href = result.url;
          link.textContent = result.hostname;
          createMessage.append(link);
        } else if (result.status === "partial") {
          createMessage.textContent = `Partial: ${result.succeeded} succeeded; ${result.failed} failed. ${result.message || "Press Create again to finish."}`;
        } else createMessage.textContent = result.message || "Unable to create the Published Application.";
      });
      async function refreshSession() {
        const response = await fetch("/api/session");
        const session = await response.json();
        form.hidden = session.authenticated;
        dashboard.hidden = !session.authenticated;
      }
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "";
        const fields = new FormData(form);
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: fields.get("username"), password: fields.get("password") }),
        });
        if (!response.ok) {
          message.textContent = response.status === 429 ? "Too many attempts. Try again later." : "Unable to sign in.";
          return;
        }
        form.reset();
        await refreshSession();
      });
      document.querySelector("#logout").addEventListener("click", async () => {
        const response = await fetch("/api/logout", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: "{}",
        });
        if (response.ok) await refreshSession();
      });
      refreshSession();
    </script>
  </body>
</html>
